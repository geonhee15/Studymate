<svg viewBox="0 0 450 220" width="450" height="220" xmlns="http://www.w3.org/2000/svg"><circle cx="110" cy="110" r="84.9" fill="#E08A1E" fill-opacity="0.18" stroke="#E08A1E" stroke-width="1.5"/><rect x="50.0" y="50.0" width="120" height="120" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="110" cy="110" r="60.0" fill="#4F6BF0" fill-opacity="0.3" stroke="#4F6BF0" stroke-width="1.5"/><g stroke="currentColor" stroke-width="1" fill="none"><line x1="110" y1="110" x2="170" y2="110"/></g><text x="140" y="105" font-size="12" text-anchor="middle" fill="currentColor" font-weight="600">5</text><g stroke="currentColor" stroke-width="1" fill="none"><line x1="110" y1="110" x2="170" y2="50"/></g><text x="152" y="76" font-size="12" text-anchor="start" fill="currentColor" font-weight="600">5√2</text><circle cx="110" cy="110" r="2.5" fill="currentColor"/><text x="110" y="188" font-size="12" text-anchor="middle" fill="currentColor" font-weight="600">한 변 10</text><text x="225" y="60" font-size="12" text-anchor="start" fill="currentColor">내접원: 반지름 = 변의 절반 = 5</text><text x="225" y="84" font-size="12" text-anchor="start" fill="currentColor">외접원: 반지름 = 대각선의 절반 = 5√2</text><text x="240" y="120" font-size="13" text-anchor="start" fill="currentColor" font-weight="600">넓이비 25π : 50π = 1 : 2</text><text x="240" y="150" font-size="11" text-anchor="start" fill="currentColor" opacity="0.8">반지름은 중심에서 '접점'으로,</text><text x="240" y="166" font-size="11" text-anchor="start" fill="currentColor" opacity="0.8">또는 중심에서 '꼭짓점'으로 긋는다</text></svg>
