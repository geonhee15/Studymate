<svg viewBox="0 0 320 170" width="320" height="170" xmlns="http://www.w3.org/2000/svg" font-size="12" fill="currentColor">
  <text x="160" y="16" text-anchor="middle" font-weight="600">12의 약수: 짝 짓기 (d, 12 ÷ d)</text>
  <g stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M40 120 C40 30, 280 30, 280 120" stroke="#4F6BF0"/>
    <path d="M88 120 C88 62, 232 62, 232 120" stroke="#E08A1E"/>
    <path d="M136 120 C136 92, 184 92, 184 120" stroke="#29A066"/>
  </g>
  <g>
    <circle cx="40" cy="132" r="13" fill="#4F6BF0" fill-opacity="0.35" stroke="currentColor" stroke-width="1"/>
    <circle cx="280" cy="132" r="13" fill="#4F6BF0" fill-opacity="0.35" stroke="currentColor" stroke-width="1"/>
    <circle cx="88" cy="132" r="13" fill="#E08A1E" fill-opacity="0.35" stroke="currentColor" stroke-width="1"/>
    <circle cx="232" cy="132" r="13" fill="#E08A1E" fill-opacity="0.35" stroke="currentColor" stroke-width="1"/>
    <circle cx="136" cy="132" r="13" fill="#29A066" fill-opacity="0.35" stroke="currentColor" stroke-width="1"/>
    <circle cx="184" cy="132" r="13" fill="#29A066" fill-opacity="0.35" stroke="currentColor" stroke-width="1"/>
  </g>
  <g text-anchor="middle" font-weight="600">
    <text x="40" y="136">1</text><text x="88" y="136">2</text><text x="136" y="136">3</text>
    <text x="184" y="136">4</text><text x="232" y="136">6</text><text x="280" y="136">12</text>
  </g>
  <g text-anchor="middle" font-size="11" opacity="0.8">
    <text x="160" y="48">1 × 12</text>
    <text x="160" y="72">2 × 6</text>
    <text x="160" y="95">3 × 4</text>
  </g>
  <text x="160" y="162" text-anchor="middle" font-size="11" opacity="0.8">짝이 3개 → 약수 6개 (짝수). 짝이 안 맞는 건 d = √n일 때뿐</text>
</svg>
