<svg viewBox="0 0 400 200" width="400" height="200" xmlns="http://www.w3.org/2000/svg" font-size="13" fill="currentColor">
  <rect x="10" y="10" width="300" height="180" rx="10" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
  <circle cx="120" cy="100" r="70" fill="#4F6BF0" fill-opacity="0.18" stroke="#4F6BF0" stroke-width="1.5"/>
  <circle cx="200" cy="100" r="70" fill="#29A066" fill-opacity="0.18" stroke="#29A066" stroke-width="1.5"/>
  <text x="70" y="40" font-weight="600">축구 18</text>
  <text x="200" y="40" font-weight="600">농구 15</text>
  <text x="85" y="106" text-anchor="middle" font-size="18" font-weight="700">11</text>
  <text x="160" y="106" text-anchor="middle" font-size="18" font-weight="700">7</text>
  <text x="238" y="106" text-anchor="middle" font-size="18" font-weight="700">8</text>
  <text x="252" y="178" font-size="18" font-weight="700" text-anchor="middle">4</text>
  <text x="20" y="178" font-size="12">반 30명</text>
  <text x="325" y="60" font-size="12">가운데 7부터</text>
  <text x="325" y="78" font-size="12">채운다</text>
  <text x="325" y="110" font-size="12">18 + 15 − 7</text>
  <text x="325" y="128" font-size="12">= 26</text>
  <text x="325" y="160" font-size="12">30 − 26 = 4</text>
</svg>
