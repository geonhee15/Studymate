<svg viewBox="0 0 320 196" width="320" height="196" xmlns="http://www.w3.org/2000/svg" font-size="12" fill="currentColor"><rect x="16" y="14" width="140" height="140" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="86.0" cy="84.0" r="70.0" fill="#4F6BF0" fill-opacity="0.35" stroke="#4F6BF0" stroke-width="1.5"/><line x1="86.0" y1="84.0" x2="156" y2="84.0" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3"/><circle cx="86.0" cy="84.0" r="2.5" fill="currentColor"/><text x="121.0" y="78.0" text-anchor="middle">r = 1</text><text x="86.0" y="170" text-anchor="middle">한 변 2</text><text x="168" y="58">원 넓이 π·1² = π</text><text x="168" y="80">정사각형 넓이 2² = 4</text><text x="168" y="114" font-weight="600">확률 = π/4</text></svg>
